# SonarCloud config. Before the scan runs you must (one-time):
#  1. Import this repo at https://sonarcloud.io (sign in with GitHub).
#  2. Confirm the org slug + project key below match what SonarCloud shows.
#  3. Add a SONAR_TOKEN repo secret (Settings → Secrets → Actions).
sonar.organization=uniksf
sonar.projectKey=UnikSF_FinanceWatcher

sonar.sources=app,lib,components
sonar.tests=lib
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=node_modules/**,.next/**,**/*.test.ts

# Coverage from `npm run test:cov` (vitest v8 → lcov).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
